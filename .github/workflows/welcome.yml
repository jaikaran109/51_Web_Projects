---
# Welcome workflow — greets first-time contributors on both issues and pull
# requests with a friendly message and a reminder of the contribution guide.
# https://github.com/actions/starter-workflows/blob/main/workflows/welcome.yml

name: Welcome

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - name: Welcome first-time contributors
        uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 Hello! Thanks for opening this issue. A maintainer will review it soon.

            Please make sure:
            - The title is clear and describes the problem
            - You have checked existing issues for duplicates
            - You include as much detail as possible

            Happy coding! 🚀
          pr-message: |
            🎉 Welcome and thank you for your first pull request!

            Before we can review it, please:
            - Read our [Contributing Guide](https://github.com/jaikaran109/51_Web_Projects/blob/main/CONTRIBUTING.md)
            - Keep your PR focused on a single issue/feature
            - Add a screenshot if your change affects the UI
            - Ensure your code follows the project guidelines

            Happy Coding! 🚀
