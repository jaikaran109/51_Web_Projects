name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-image-optimization.txt
      - name: Configure Pages
        uses: actions/configure-pages@983d7716d3b950a4da1e1a4118742dfe65b3401f # v5.0.0
      - name: Optimize raster images
        run: |
          if python -m pip install --require-hashes -r scripts/requirements-image-optimization.txt; then
            python scripts/optimize_images.py
          else
            echo "::warning::Image optimization dependency unavailable; deploying original assets."
          fi
      - name: Upload site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db9d413e71c9c21ae3c6e2df1936171507fe23 # v4.0.5
