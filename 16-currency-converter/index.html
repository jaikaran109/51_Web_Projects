<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Currency Converter</h1>

        <div class="currency-container">
            <!-- from -->
            <label class="sr-only" for="currency-first">Currency to convert from</label>
            <select id="currency-first"></select>
            <label class="sr-only" for="worth-first">Amount to convert</label>
            <input type="number" id="worth-first" value="1" min="0" step="any" inputmode="decimal">
        </div>

        <div class="swap-row">
            <button type="button" id="swap-button" class="swap-button" aria-label="Swap currencies" title="Swap currencies">&#8644;</button>
        </div>

        <div class="currency-container">
            <!-- to -->
            <label class="sr-only" for="currency-second">Currency to convert to</label>
            <select id="currency-second"></select>
            <label class="sr-only" for="worth-second">Converted amount</label>
            <input type="number" id="worth-second" disabled>
        </div>

        <p class="exchange-rate" id="exchange-rate">1 USD = 95.0825 INR</p>
        <p class="status" id="status" role="status" aria-live="polite"></p>
        <p class="error-message" id="error-message" role="alert" aria-live="assertive"></p>

        <p class="attribution">
            Rates by <a href="https://www.exchangerate-api.com" target="_blank" rel="noopener noreferrer">Exchange Rate API</a>
        </p>
    </main>
    <script src="./currencies.js"></script>
    <script src="./app.js"></script>
</body>
</html>
