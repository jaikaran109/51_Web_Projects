<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <meta name="description" content="Explore Tic-Tac-Toe in the 51 Web Projects collection. Discover this hands-on web development project and its features.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="msg-container hide">
        <p id="msg">Winner</p>
        <button id="new-btn">New Game</button>
    </div>
    <main>
        <h1>Tic Tac Toe</h1>
        <div class="scoreboard">
    <div class="score-card player-o">
        <span class="player-label">PLAYER O</span>
        
        <span class="score" id="score-o">0</span>
        <span class="score-caption">WINS</span>
    </div>

    <div class="score-card draws">
        <span class="player-label">DRAWS</span>

        <span class="score" id="score-draw">0</span>
        <span class="score-caption">GAMES</span>
    </div>

    <div class="score-card player-x">
        <span class="player-label">PLAYER X</span>
      
        <span class="score" id="score-x">0</span>
        <span class="score-caption">WINS</span>
    </div>
</div>
        <div class="mode-select">
            <label for="mode">Mode</label>
            <select id="mode">
                <option value="two">Two players</option>
                <option value="computer">Vs computer (you are O)</option>
            </select>
        </div>
        <div class="container">
            <div class="game">
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
            </div>
        </div>
        <button id="reset-btn">Reset Game</button>
    </main>
    <script src="app.js"></script>
</body>
</html>
